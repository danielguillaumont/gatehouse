- id: modern.benign.stays-modern
  category: benign
  milestone: m4
  title: A 2026-07-28 server across two restarts (no downgrade)
  expect: benign
  era: auto
  phases:
    - server: {modern: true, tools: *forecast}
      steps: [list, {call: {tool: get_forecast, arguments: {city: Paris}}}]
    - server: {modern: true, tools: *forecast}
      steps: [list, {call: {tool: get_forecast, arguments: {city: Lyon}}}]

