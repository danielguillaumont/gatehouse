name: secrets

# Full-history gitleaks scan on every push and PR, including docs-only changes (ci.yml
# skips those). Reviewed synthetic canaries are pinned by fingerprint in .gitleaksignore,
# so any new secret, anywhere in history, fails.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: gitleaks v8.24.2, full history
        run: |
          docker run --rm -v "$PWD:/repo:ro" --entrypoint sh zricethezav/gitleaks:v8.24.2 -c             'git config --global --add safe.directory /repo && cd /repo && gitleaks git . --no-banner --redact --gitleaks-ignore-path .gitleaksignore'
