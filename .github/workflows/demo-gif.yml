name: demo-gif

# Renders docs/assets/demo.gif from demo/demo.tape with charmbracelet VHS on Ubuntu.
# Download the artifact and commit it; the workflow itself has no write access.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - uses: charmbracelet/vhs-action@v2
        with:
          path: demo/demo.tape
      - uses: actions/upload-artifact@v5
        with:
          name: demo-gif
          path: docs/assets/demo.gif
          if-no-files-found: error
