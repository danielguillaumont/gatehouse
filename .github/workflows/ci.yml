name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright

  test:
    # A reduced matrix keeps Actions minutes low on a private repo (see docs/decisions.md):
    # oldest + newest Python on Linux, and Windows.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked --all-extras
      - run: uv run pytest -q

  attack-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - name: Baseline (no proxy) - every attack must work, otherwise a scenario is broken
        run: uv run python -m attacks run --target direct --out reports/direct
      - name: Attack suite through gatehouse
        run: uv run python -m attacks run --target gatehouse --out reports/gatehouse
      - name: Report
        if: always()
        run: cat reports/gatehouse/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Canary check (no secret reaches events or stderr)
        run: uv run python -m attacks canary-check reports/gatehouse
      - name: Flow chains under every flow.mode (0 may complete in approve/enforce)
        run: |
          uv run python -m attacks flow --out reports/flow
          cat reports/flow/flow.md >> "$GITHUB_STEP_SUMMARY"
      - name: Held-out v2 (frozen, measured only; D-046)
        run: |
          uv run python -m attacks.heldout2.mutate --check
          H2=attacks/heldout2/scenarios
          uv run python -m attacks run --target direct --scenarios $H2 --out reports/heldout2-direct
          uv run python -m attacks run --target gatehouse --scenarios $H2 --out reports/heldout2
          uv run python -m attacks canary-check reports/heldout2 --scenarios $H2
          cat reports/heldout2/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: HTTP scenarios (baseline and gatehouse)
        run: |
          uv run python -m attacks http --target direct --out reports/direct-http
          uv run python -m attacks http --target gatehouse --out reports/gatehouse-http
      - name: Latency benchmark (informational, shared runners are noisy)
        # allow: Cedar checked against the reference (default); native: the reference
        # alone (allow minus native = Cedar's cost); flow: Rule of Two on, results
        # fingerprinted (D-043). Same runner, one after the other.
        run: |
          for p in allow native flow; do
            uv run python -m bench.latency --iterations 100 --policy "$p" --out "reports/bench-$p"
            cat "reports/bench-$p/latency.md" >> "$GITHUB_STEP_SUMMARY"
          done
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: attack-reports
          path: reports/

  detections:
    # Detection-as-code: every analytics rule runs in a real Kusto engine against the
    # sample data and must return the rows in detections/expected.yaml.
    runs-on: ubuntu-latest
    services:
      kusto:
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest
        env:
          ACCEPT_EULA: "Y"
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked --all-extras
      - run: uv run python -m detections.kusto --url http://localhost:8080 --wait 300

  infra:
    # Compile only; nothing is deployed. Fails on errors and on BCP081 (a resource type or
    # API version missing from Bicep's type index), so a wrong API version can't slip in.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: az bicep install
      - name: Build Bicep
        run: |
          set -o pipefail
          az bicep build --file infra/main.bicep --stdout 2>build.log >/dev/null || { cat build.log; exit 1; }
          cat build.log
          if grep -q "BCP081" build.log; then echo "unknown resource type or API version"; exit 1; fi
      - name: Build parameters file
        run: az bicep build-params --file infra/main.bicepparam --stdout >/dev/null
