name: ci

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**/*.md"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright

  test:
    # A reduced matrix keeps Actions minutes low on a private repo (see docs/decisions.md):
    # oldest + newest Python on Linux, and Windows.
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: "3.11" }
          - { os: ubuntu-latest, python: "3.13" }
          - { os: windows-latest, python: "3.12" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --locked
      - run: uv run pytest -q

  attack-suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Baseline (no proxy) - every attack must work, otherwise a scenario is broken
        run: uv run python -m attacks run --target direct --out reports/direct
      - name: Attack suite through gatehouse
        run: uv run python -m attacks run --target gatehouse --out reports/gatehouse
      - name: Report
        if: always()
        run: cat reports/gatehouse/report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Canary check (no secret reaches events or stderr)
        run: uv run python -m attacks canary-check reports/gatehouse
      - name: Latency benchmark (informational, shared runners are noisy)
        run: |
          uv run python -m bench.latency --iterations 100 --out reports/bench
          cat reports/bench/latency.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: attack-reports
          path: reports/

  detections:
    # Detection-as-code: every analytics rule runs in a real Kusto engine against the
    # sample data and must return the rows in detections/expected.yaml.
    runs-on: ubuntu-latest
    services:
      kusto:
        image: mcr.microsoft.com/azuredataexplorer/kustainer-linux:latest
        env:
          ACCEPT_EULA: "Y"
        ports:
          - 8080:8080
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run python -m detections.kusto --url http://localhost:8080 --wait 300
