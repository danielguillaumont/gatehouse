name: competitors

# Runs the gatehouse attack suite against other MCP stdio gateways (D-021). They are
# installed in their own virtualenv on a throwaway runner, never on a developer machine.
# Versions are pinned to the ones described in docs/prior-art.md; results go into
# docs/evaluation.md with this workflow's run id.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: gatehouse
            package: ""
          - target: gateward
            package: gateward==0.3.0
          - target: mcp-watchdog
            package: mcp-watchdog==0.1.9
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - name: Install ${{ matrix.package }} in an isolated venv
        if: matrix.package != ''
        run: |
          uv venv "$RUNNER_TEMP/competitor" --python 3.12
          uv pip install --python "$RUNNER_TEMP/competitor/bin/python" "${{ matrix.package }}"
          uv pip freeze --python "$RUNNER_TEMP/competitor/bin/python" > competitor-freeze.txt
          echo "$RUNNER_TEMP/competitor/bin" >> "$GITHUB_PATH"
      - name: Check the wrapper is on PATH
        if: matrix.package != ''
        run: command -v ${{ matrix.target }}
      - name: Run the attack suite through ${{ matrix.target }}
        run: |
          uv run python -m attacks run --target ${{ matrix.target }} --out reports/${{ matrix.target }} --summary 2> suite.log || true
          tail -n 120 suite.log
          cat reports/${{ matrix.target }}/report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: report-${{ matrix.target }}
          path: |
            reports/${{ matrix.target }}
            competitor-freeze.txt
          if-no-files-found: ignore
            suite.log
