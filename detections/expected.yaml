# What each analytics rule must return on detections/sample_data/events.jsonl.
# `rows` is the exact row count. Each `include` entry must match at least one row on
# every listed column. Benign stories (eval-benign.*) must never appear in any result.
GH001_rug_pull:
  rows: 2
  include:
    - {ToolName: get_forecast, ServerName: srv}
    - {ToolName: search_docs, ServerName: srv}
GH002_unapproved_tool:
  rows: 2
  include:
    - {ServerName: build-tools, ToolName: run_command, TimesOffered: 2, BlockedCalls: 1}
    - {AgentSessionId: eval-blocked-burst, ToolName: internal_admin, BlockedCalls: 12}
GH003_secret_to_egress_tool:
  rows: 2
  include:
    - {RuleId: aws-access-key-id, ToolName: send_message, ToolRisk: egress}
    - {RuleId: github-token, ToolName: send_message, ToolRisk: egress}
GH004_guardrail_tampering:
  rows: 3
  include:
    - {Signal: policy.tampered, AgentSessionId: eval-policy-tampered}
    - {Signal: gatehouse.fail_open}
    - {Signal: args.self_protect, ToolName: write_file}
GH005_blocked_call_burst:
  rows: 1
  include:
    - {AgentSessionId: eval-blocked-burst, BlockedCalls: 12}
GH006_injection_then_egress:
  rows: 1
  include:
    - {AgentSessionId: eval-cross-server-injection, SourceServer: web, SourceTool: fetch_page, InjectionAction: blocked, EgressCalls: 1}
GH007_rule_of_two_unapproved:
  rows: 1
  include:
    - {AgentSessionId: eval-flow.polite-web-injection-to-email, Calls: 1, FlowMode: approve}
GH008_private_data_to_egress:
  rows: 1
  include:
    - {AgentSessionId: eval-flow.polite-web-injection-to-email, ToolName: send_email, RuleId: private-data-copied}
GH009_response_control_engaged:
  rows: 3
  include:
    - {Control: remote kill, AgentSessionId: control-listener}
    - {Control: kill switch, AgentSessionId: eval-remote-kill, ServerName: chat}
    - {Control: circuit breaker, AgentSessionId: eval-circuit-breaker, Strikes: 2}
GH010_classifier_injection:
  rows: 2
  include:
    - {ServerName: web, Classifier: classifier.judge, Hits: 1, Unavailable: 0}
    - {ServerName: docs, Classifier: classifier.judge, Hits: 0, Unavailable: 1}
GH011_bearer_token_failures:
  rows: 1
  include:
    - {ServerName: tickets, ClientAddress: 203.0.113.77, Failures: 13}
# Hunting queries are only run, unless they have an entry here.
hunting/first_seen_tool_per_agent:
  include:
    - {ServerName: docs, ToolName: fetch_page, ClientName: claude-code}
hunting/rare_egress_domains:
  include:
    - {Domain: contoso-advisors.example, Calls: 1, Blocked: 1}
    - {Domain: vendor-payments.example, Sessions: 1}
hunting/rule_of_two_by_principal:
  rows: 1
  include:
    - {Principal: DEV-WS01/gatehouse-attack-suite, Completions: 2, Approved: 1, Blocked: 1}
