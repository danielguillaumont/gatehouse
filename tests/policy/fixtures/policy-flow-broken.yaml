# Deliberately broken copy of examples/policy-flow.yaml: `policy prove` must reject it
# (tests/policy/test_prove.py and the policy-prove CI job). Two mistakes:
# flow control is off, and a server-specific allow overrides the delete rule.
version: 1
default_action: block

flow:
  mode: "off"

servers:
  notes:
    tools:
      "*": allow
      "delete_*": require_approval
      delete_note: allow
    labels:
      "*": [private_data]
      "delete_*": [state_change]

  web:
    tools:
      fetch:
        action: allow
        when:
          url: {url_hosts: ["docs.example.com", "*.wikipedia.org"]}
        otherwise: require_approval
    labels:
      fetch: [untrusted_input, egress]

  mail:
    tools:
      "list_*": allow
      "read_*": allow
      send_email:
        action: allow
        when:
          to: {email_domains: ["example.com"]}
          cc: {email_domains: ["example.com"]}
        otherwise: require_approval
    labels:
      "list_*": [untrusted_input, private_data]
      "read_*": [untrusted_input, private_data]
      send_email: [egress]

  "*":
    tools:
      "*shell*": block
      "*exec*": block
